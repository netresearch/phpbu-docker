schemaVersion: 2.0.0

metadataTest:
  user: "phpbu"
  workdir: "/app"
  entrypoint: ["/app/docker-entrypoint.sh"]
  cmd: ["--help"]
  exposedPorts: []
  volumes: ["/backups"]

fileExistenceTests:
  - name: "docker-entrypoint.sh exists"
    path: "/app/docker-entrypoint.sh"
    shouldExist: true
    permissions: "-rwxr-xr-x"

  - name: "phpbu binary exists"
    path: "/app/vendor/bin/phpbu"
    shouldExist: true
    permissions: "-rwxr-xr-x"

  - name: "composer.json exists"
    path: "/app/composer.json"
    shouldExist: true

  - name: "backups directory exists"
    path: "/backups"
    shouldExist: true
    isExecutableBy: "owner"

  - name: "No composer in production"
    path: "/usr/bin/composer"
    shouldExist: false

fileContentTests:
  - name: "entrypoint contains timezone logic"
    path: "/app/docker-entrypoint.sh"
    expectedContents: ["#!/bin/sh", "date.timezone", "grep -Eq", "exec /app/vendor/bin/phpbu"]

  - name: "phpbu is executable PHP"
    path: "/app/vendor/bin/phpbu"
    expectedContents: ["#!/usr/bin/env php"]

commandTests:
  - name: "phpbu version works"
    command: "/app/vendor/bin/phpbu"
    args: ["--version"]
    expectedOutput: ["phpbu"]
    exitCode: 0

  - name: "phpbu help works"
    command: "/app/vendor/bin/phpbu"
    args: ["--help"]
    expectedOutput: ["backup", "configuration"]
    exitCode: 0

  - name: "Running as non-root"
    command: "id"
    args: ["-u"]
    expectedOutput: ["1000"]
    exitCode: 0

  - name: "Running as phpbu user"
    command: "id"
    args: ["-un"]
    expectedOutput: ["phpbu"]
    exitCode: 0

  - name: "mysql client available"
    command: "which"
    args: ["mysql"]
    exitCode: 0

  - name: "pg_dump available"
    command: "which"
    args: ["pg_dump"]
    exitCode: 0

  - name: "mongodump available"
    command: "which"
    args: ["mongodump"]
    exitCode: 0

  - name: "redis-cli available"
    command: "which"
    args: ["redis-cli"]
    exitCode: 0

  - name: "No shell for phpbu user"
    command: "getent"
    args: ["passwd", "phpbu"]
    expectedOutput: ["/sbin/nologin"]
    exitCode: 0

  - name: "No root-owned writable files in /app"
    command: "find"
    args: ["/app", "-user", "root", "-perm", "-002", "-type", "f"]
    expectedOutput: []
    exitCode: 0

  - name: "tz.ini writable by phpbu user"
    command: "sh"
    args: ["-c", "echo 'date.timezone = Europe/Berlin' > /usr/local/etc/php/conf.d/tz.ini && grep -q 'Europe/Berlin' /usr/local/etc/php/conf.d/tz.ini"]
    exitCode: 0

  - name: "tz.ini exists and is empty by default"
    command: "sh"
    args: ["-c", "test -f /usr/local/etc/php/conf.d/tz.ini && test ! -s /usr/local/etc/php/conf.d/tz.ini"]
    exitCode: 0

  - name: "conf.d not writable by phpbu user"
    command: "sh"
    args: ["-c", "! touch /usr/local/etc/php/conf.d/test-write.ini 2>/dev/null"]
    exitCode: 0

  - name: "No setuid binaries in common paths"
    command: "sh"
    args: ["-c", "find /usr /bin /sbin -perm /4000 -type f 2>/dev/null || true"]
    expectedOutput: []
    exitCode: 0
