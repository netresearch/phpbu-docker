name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly security rebuild
  workflow_dispatch:  # Allow manual trigger
  merge_group:

permissions: {}

jobs:
  # The former inline bake build/scan/sign job now delegates to
  # netresearch/.github's reusable build-container-bake.yml. It builds every
  # docker-bake.hcl target (minimal + full) in one pass, scans the produced
  # images with Trivy (report-only, matching build-container.yml), and — on
  # push/schedule/dispatch — pushes and cosign-signs the tag fan-out the HCL
  # computes. The composer.lock version extraction feeds the HCL `variable`
  # blocks via pre-build-command -> $GITHUB_ENV (PHPBU_VERSION, PHPBU_MINOR,
  # PHPBU_MAJOR, BUILD_DATE, GIT_SHA).
  #
  # PR and merge-queue runs load a single-platform (amd64) build so Trivy
  # can scan the local image, and disable the in-image attestations the HCL declares
  # (provenance + SBOM) — the docker exporter used by --load cannot export
  # attestations, and the previous inline job likewise produced attestations
  # on push only (its load path built the attest-free ci/ci-full targets).
  #
  # Functional smoke tests (docker run --version/--help, non-root, TZ
  # sanitisation, read-only fs, simulate mode, full-variant extras) and the
  # container-structure test live in test.yml; Dockerfile lint and the
  # bake-graph validation live in lint.yml.
  build:
    uses: netresearch/.github/.github/workflows/build-container-bake.yml@main
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    with:
      targets: minimal,full
      push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
      load: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
      platforms: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'linux/amd64' || '' }}
      scan: true
      sign: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
      attest: true
      sbom: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
      provenance: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'false' || '' }}
      # The weekly run exists to pick up OS patches through `apk upgrade`.
      # With the layer cache on, that step is restored from the previous
      # build and the rebuild publishes the same packages again.
      cache: ${{ github.event_name != 'schedule' }}
      pre-build-command: |
        V=$(jq -r '.packages[] | select(.name == "phpbu/phpbu") | .version' app/composer.lock)
        {
          echo "PHPBU_VERSION=$V"
          echo "PHPBU_MINOR=$(echo "$V" | cut -d. -f1,2)"
          echo "PHPBU_MAJOR=$(echo "$V" | cut -d. -f1)"
          echo "BUILD_DATE=$(date -u +%Y-%m-%d)"
          echo "GIT_SHA=$(git rev-parse --short HEAD)"
        } >> "$GITHUB_ENV"

  # Image release. After a push to main has built and pushed the image, the
  # plan step (.github/scripts/plan-release.sh) decides whether a commit since
  # the last v* tag changed the image and, if so, which version follows. The
  # release version counts image changes; the image tags keep the phpbu
  # version, so title and body name both. The tag is created through the API
  # with the job token, which starts no other workflow.
  release-plan:
    name: Plan image release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-release
      cancel-in-progress: false
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      title: ${{ steps.plan.outputs.title }}
      body: ${{ steps.plan.outputs.body }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # A later push already queued behind this one releases the combined
      # changes; tagging this commit afterwards would put an older commit on a
      # newer version.
      - name: Check that this commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main moved on to $tip; its run publishes the release"
          fi

      - name: Plan the release
        id: plan
        if: steps.tip.outputs.current == 'true'
        env:
          IMAGE_TAGS: ${{ needs.build.outputs.tags }}
        run: .github/scripts/plan-release.sh

      - name: Create the release tag
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="$TITLE" -f object="$GITHUB_SHA" -f type=commit --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag_sha" --jq .ref

  release:
    name: Publish image release
    needs: release-plan
    if: needs.release-plan.outputs.release == 'true'
    uses: netresearch/.github/.github/workflows/gh-release-image.yml@main
    permissions:
      contents: write
    with:
      tag-name: ${{ needs.release-plan.outputs.tag }}
      title: ${{ needs.release-plan.outputs.title }}
      body: ${{ needs.release-plan.outputs.body }}
      generate-release-notes: false
