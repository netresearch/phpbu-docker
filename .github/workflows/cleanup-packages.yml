name: Cleanup Old Packages

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at 3am UTC
    - cron: '0 3 * * 0'

permissions: {}

env:
  PACKAGE_NAME: phpbu-docker

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old untagged versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ env.PACKAGE_NAME }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true

      - name: Summary
        run: |
          echo "## Package Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Package: ${{ env.PACKAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- Kept minimum: 10 versions" >> $GITHUB_STEP_SUMMARY
          echo "- Deleted only untagged: true" >> $GITHUB_STEP_SUMMARY
