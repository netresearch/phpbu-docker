; PHP Security Hardening for phpbu
; These settings improve security without limiting phpbu functionality

; Hide PHP version in HTTP headers (minimal impact for CLI, good practice)
expose_php = Off

; Error handling - log don't display
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Disable dangerous functions not needed by phpbu
; Note: exec, shell_exec, proc_open, passthru, system are REQUIRED for backup clients
disable_functions = dl,popen,show_source,highlight_file

; Disable remote code inclusion (phpbu doesn't need this)
allow_url_include = Off

; Session settings (not used in CLI but good defaults)
session.cookie_httponly = On
session.cookie_secure = On
session.use_strict_mode = On

; Disable assert in production
zend.assertions = -1
