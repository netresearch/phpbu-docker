# compose.yml - Docker Compose for phpbu
# Usage: docker compose run --rm phpbu --configuration=/config/backup.json

name: phpbu

services:
  phpbu:
    image: ghcr.io/netresearch/phpbu-docker:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./config:/config:ro
      - ./backups:/backups
    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777,size=64M,noexec,nosuid,nodev

  # Development mode (minimal variant)
  dev:
    build:
      context: .
      target: minimal
    volumes:
      - ./config:/config:ro
      - ./backups:/backups
    environment:
      TZ: ${TZ:-UTC}
    # Security hardening (same as production)
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777,size=64M,noexec,nosuid,nodev
    command: ["--help"]

  # Development mode (full variant)
  dev-full:
    build:
      context: .
      target: full
    volumes:
      - ./config:/config:ro
      - ./backups:/backups
    environment:
      TZ: ${TZ:-UTC}
    # Security hardening (same as production)
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777,size=64M,noexec,nosuid,nodev
    command: ["--help"]
